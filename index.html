<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sagar Parajuli - Portfolio</title>
  <style>
    /* Base dark mode styles matching your design */
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
    }

    /* Heading styling */
    .hero-title {
      font-size: 2.5rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 24px;
    }

    /* Dynamic text container with smooth fade transition */
    #dynamic-text {
      display: inline-block;
      color: #a5b4fc; /* Highlighted color for the dynamic title */
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
    }

    /* Fade-out state applied during transition */
    #dynamic-text.fade-out {
      opacity: 0;
      transform: translateY(-4px); /* Subtle upward shift while fading out */
    }

    /* Primary button styling */
    .btn-primary {
      background-color: #f59e0b;
      color: #000000;
      border: none;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 9999px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-primary:hover {
      background-color: #d97706;
    }
  </style>
</head>
<body>

  <header>
    <h1 class="hero-title">
      Welcome to the official portfolio of<br>
      Sagar Parajuli <span id="dynamic-text">Public Health Researcher</span>
    </h1>
    <button class="btn-primary">About Me</button>
  </header>

  <script>
    // JavaScript logic for smooth text fade transition
    const dynamicText = document.getElementById('dynamic-text');
    const titles = ['Public Health Researcher', 'Public Health Advocate'];
    let currentIndex = 0;

    function changeTitle() {
      // Step 1: Start fade out
      dynamicText.classList.add('fade-out');

      // Step 2: Swap text mid-transition, then fade back in
      setTimeout(() => {
        currentIndex = (currentIndex + 1) % titles.length;
        dynamicText.textContent = titles[currentIndex];
        dynamicText.classList.remove('fade-out');
      }, 500); // 500ms matches the CSS transition time
    }

    // Change title every 3.5 seconds
    setInterval(changeTitle, 3500);
  </script>

</body>
</html>
