<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sagar Parajuli - Portfolio</title>
  <style>
    /* Global Reset & Dark Theme */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 40px;
    }

    .hero-container {
      max-width: 900px;
    }

    /* Heading Styling */
    .hero-title {
      font-size: 2.8rem;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 32px;
      color: #f3f4f6;
    }

    /* Dynamic Text Element with Smooth Opacity Fade */
    #dynamic-text {
      display: inline-block;
      color: #93c5fd; /* Accent color for the changing title */
      opacity: 1;
      transform: translateY(0);
      /* Pure opacity & slight vertical translation — NO 3D/folding effects */
      transition: opacity 0.5s ease-in-out, transform 0.5s ease-in-out;
    }

    /* Faded-out state used during text transition */
    #dynamic-text.fade-out {
      opacity: 0;
      transform: translateY(-4px);
    }

    /* Button Styling */
    .btn-about {
      display: inline-block;
      background-color: #eab308;
      color: #000000;
      font-weight: 600;
      padding: 12px 28px;
      border-radius: 9999px;
      text-decoration: none;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .btn-about:hover {
      background-color: #ca8a04;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>

  <div class="hero-container">
    <h1 class="hero-title">
      Welcome to the official portfolio of<br />
      Sagar Parajuli <span id="dynamic-text">Public Health Researcher</span>
    </h1>
    
    <a href="#about" class="btn-about">About Me</a>
  </div>

  <script>
    // Dynamic text-swapping logic
    const dynamicText = document.getElementById('dynamic-text');
    const titles = ['Public Health Researcher', 'Public Health Advocate'];
    let currentIndex = 0;

    function changeTitle() {
      // 1. Trigger the CSS fade-out
      dynamicText.classList.add('fade-out');

      // 2. Change text halfway through, then trigger fade-in
      setTimeout(() => {
        currentIndex = (currentIndex + 1) % titles.length;
        dynamicText.textContent = titles[currentIndex];
        dynamicText.classList.remove('fade-out');
      }, 500); // Matches the 0.5s transition time in CSS
    }

    // Change title every 3.5 seconds
    setInterval(changeTitle, 3500);
  </script>

</body>
</html>
