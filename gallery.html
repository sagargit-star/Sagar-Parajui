            :root {
                --bg-dark-base: #030712;
                --bg-card: rgba(15, 23, 42, 0.75);
                --bg-card-hover: rgba(30, 41, 59, 0.85);
                --accent-gold: #fce38a;
                --accent-warm: #f3a152;
                --text-main: #f8fafc;
                --text-muted: #cbd5e1;
                --border-subtle: rgba(252, 227, 138, 0.12);
            }

            body {
                background: linear-gradient(180deg, #030712 0%, #070d1e 35%, #0b132b 70%, #030712 100%) !important;
                background-attachment: fixed !important;
                color: var(--text-main) !important;
                font-family: 'DM Sans', sans-serif;
                overflow-x: hidden;
            }

            /* Floating Navbar */
            .navbar {
                position: fixed !important;
                top: 0;
                left: 0;
                right: 0;
                z-index: 1030;
                background: rgba(3, 7, 18, 0.85) !important;
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                border-bottom: 1px solid var(--border-subtle);
                transition: top 0.4s ease-in-out, background 0.3s ease;
            }

            .navbar.nav-hidden {
                top: -90px !important;
            }

            .navbar-trigger {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 25px;
                z-index: 1029;
            }

            .navbar.nav-hidden:hover,
            .navbar-trigger:hover + .navbar,
            .navbar:focus-within {
                top: 0 !important;
                background: rgba(3, 7, 18, 0.95) !important;
            }

            .navbar-nav .nav-link {
                color: var(--text-main) !important;
                font-weight: 500;
                transition: color 0.3s ease, transform 0.3s ease;
            }

            .navbar-nav .nav-link:hover, .navbar-nav .nav-link.active {
                color: var(--accent-gold) !important;
                transform: translateY(-2px);
            }

            /* Header Banner */
            .page-header-banner {
                position: relative;
                padding-top: 150px;
                padding-bottom: 40px;
                background: radial-gradient(circle at 50% 10%, #0f172a 0%, #030712 85%) !important;
                text-align: center;
            }

            .page-header-banner h1 {
                font-size: 3rem;
                font-weight: 700;
                background: linear-gradient(135deg, #ffffff 0%, var(--accent-gold) 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }

            .gallery-badge {
                background: rgba(252, 227, 138, 0.1);
                color: var(--accent-gold);
                font-size: 0.85rem;
                font-weight: 600;
                padding: 6px 16px;
                border-radius: 20px;
                border: 1px solid rgba(252, 227, 138, 0.2);
                display: inline-block;
                margin-bottom: 15px;
            }

            /* Filter Buttons */
            .filter-btn-group {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
                margin-bottom: 35px;
            }

            .filter-btn {
                background: rgba(15, 23, 42, 0.6);
                border: 1px solid var(--border-subtle);
                color: var(--text-muted);
                padding: 8px 20px;
                border-radius: 30px;
                font-size: 0.88rem;
                font-weight: 500;
                transition: all 0.3s ease;
                cursor: pointer;
            }

            .filter-btn:hover, .filter-btn.active {
                background: linear-gradient(135deg, var(--accent-gold), var(--accent-warm));
                color: #030712;
                font-weight: 700;
                border-color: transparent;
                box-shadow: 0 4px 15px rgba(243, 161, 82, 0.3);
                transform: translateY(-2px);
            }

            /* Gallery Grid & Cards */
            .gallery-item {
                transition: transform 0.4s ease, opacity 0.4s ease;
            }

            .gallery-card {
                position: relative;
                border-radius: 16px;
                overflow: hidden;
                background: var(--bg-card);
                border: 1px solid var(--border-subtle);
                box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
                cursor: pointer;
            }

            .gallery-card-inner {
                position: relative;
                width: 100%;
                padding-top: 80%; /* Aspect ratio */
                overflow: hidden;
            }

            .gallery-img {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                object-fit: cover;
                transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            }

            .gallery-card:hover .gallery-img {
                transform: scale(1.12);
            }

            /* Eyecatchy Hover Overlay */
            .gallery-overlay {
                position: absolute;
                inset: 0;
                background: radial-gradient(circle at center, rgba(3, 7, 18, 0.2) 0%, rgba(3, 7, 18, 0.75) 100%);
                display: flex;
                align-items: center;
                justify-content: center;
                opacity: 0;
                transition: opacity 0.35s ease;
            }

            .gallery-card:hover .gallery-overlay {
                opacity: 1;
            }

            .zoom-icon {
                width: 48px;
                height: 48px;
                background: rgba(252, 227, 138, 0.25);
                border: 1px solid var(--accent-gold);
                color: var(--accent-gold);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.3rem;
                backdrop-filter: blur(4px);
                transform: scale(0.7);
                transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            }

            .gallery-card:hover .zoom-icon {
                transform: scale(1);
            }

            /* Outer Glow Border on Hover */
            .gallery-card::after {
                content: '';
                position: absolute;
                inset: 0;
                border-radius: 16px;
                border: 2px solid transparent;
                transition: border-color 0.3s ease, box-shadow 0.3s ease;
                pointer-events: none;
            }

            .gallery-card:hover::after {
                border-color: rgba(252, 227, 138, 0.6);
                box-shadow: inset 0 0 15px rgba(252, 227, 138, 0.25);
            }

            /* Lightbox Modal */
            .lightbox-modal .modal-content {
                background: rgba(3, 7, 18, 0.95);
                border: 1px solid var(--border-subtle);
                backdrop-filter: blur(20px);
                border-radius: 20px;
            }

            .lightbox-modal img {
                border-radius: 12px;
                max-height: 82vh;

            }

            /* Footer */

            .social-icon-link:hover {

        <!-- Navbar Scroll & Gallery Filter / Lightbox Logic -->
        <script>
            document.addEventListener('DOMContentLoaded', function () {
                // Navbar Hide on Scroll
                const navbar = document.querySelector('.navbar');
                function handleNavbarVisibility() {
                    if (!navbar) return;
                    if (window.scrollY > 120) {
                        navbar.classList.add('nav-hidden');
                    } else {
                        navbar.classList.remove('nav-hidden');
                    }
                }
                window.addEventListener('scroll', handleNavbarVisibility);
                handleNavbarVisibility();

                // Category Filtering
                const filterBtns = document.querySelectorAll('.filter-btn');
                const galleryItems = document.querySelectorAll('.gallery-item');

                filterBtns.forEach(btn => {
                    btn.addEventListener('click', function () {
                        filterBtns.forEach(b => b.classList.remove('active'));
                        this.classList.add('active');

                        const filterValue = this.getAttribute('data-filter');

                        galleryItems.forEach(item => {
                            if (filterValue === 'all' || item.getAttribute('data-category') === filterValue) {
                                item.style.display = 'block';
                            } else {
                                item.style.display = 'none';
                            }
                        });
                    });
                });
            });

            // Open Lightbox Function
            function openLightbox(imgSrc) {
                document.getElementById('lightboxImg').src = imgSrc;
                const modal = new bootstrap.Modal(document.getElementById('lightboxModal'));
                modal.show();
            }
        </script>
